<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Золотое сечение — анализ аудио</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:28px 18px;background:#f6f6f4;color:#171717}h1{margin-bottom:8px}p{line-height:1.5}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 18px #00000012;margin-top:18px}input[type=file]{width:100%;padding:14px;border:1px dashed #888;border-radius:12px;box-sizing:border-box}.btn{margin-top:14px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer;background:#171717;color:#fff;font-size:16px}.result{margin-top:20px;display:none}.formula{font-family:Georgia,serif;font-size:20px;background:#f3f3f0;padding:16px;border-radius:12px}.row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #eee;padding:10px 0}.label{color:#666}.value{font-weight:700;text-align:right}.note{font-size:13px;color:#666}.error{color:#a00}
</style>
</head>
<body>
<h1>Анализ золотого сечения</h1>
<p>Загрузите MP3, WAV, M4A или другой формат, поддерживаемый браузером. Анализ выполняется локально на вашем устройстве.</p>
<div class="card">
<input id="file" type="file" accept="audio/*">
<button class="btn" id="analyze">Анализировать</button>
<div id="status" class="note"></div>
<div id="result" class="result"></div>
</div>
<script>
const PHI=0.618;
const fileInput=document.getElementById('file'), btn=document.getElementById('analyze'), status=document.getElementById('status'), result=document.getElementById('result');
function fmtTime(s){const m=Math.floor(s/60), sec=s-m*60; return `${m}:${sec.toFixed(2).padStart(5,'0')}`}
function fmtNum(x,d=4){return Number(x).toFixed(d)}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function analyze(){
 const file=fileInput.files[0]; if(!file){status.textContent='Выберите аудиофайл.';return}
 btn.disabled=true; result.style.display='none'; status.textContent='Читаю аудио и анализирую структуру…';
 try{
  const arr=await file.arrayBuffer(); const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const audio=await ctx.decodeAudioData(arr); const T=audio.duration; const gold=T*PHI;
  const ch=audio.numberOfChannels, n=audio.length; const sr=audio.sampleRate;
  // Downsample into ~100 ms RMS frames.
  const frame=Math.max(1024,Math.floor(sr*0.10)); const hop=frame; const frames=[];
  for(let start=0; start+frame<=n; start+=hop){
    let sum=0; for(let c=0;c<ch;c++){const data=audio.getChannelData(c); for(let i=start;i<start+frame;i+=2){const v=data[i]; sum+=v*v;}}
    frames.push(Math.sqrt(sum/((frame/2)*ch)));
  }
  // Smooth RMS and combine with first-difference onset-like signal.
  const sm=[]; const w=5;
  for(let i=0;i<frames.length;i++){let a=0,k=0;for(let j=Math.max(0,i-w);j<=Math.min(frames.length-1,i+w);j++){a+=frames[j];k++}sm.push(a/k)}
  const peaks=[];
  for(let i=2;i<sm.length-2;i++){
    const rise=Math.max(0,sm[i]-sm[i-2]); const local=sm[i]-(sm[i-2]+sm[i+2])/2;
    const score=0.65*sm[i]+0.35*Math.max(0,local+rise);
    if(sm[i]>=sm[i-1]&&sm[i]>=sm[i+1]) peaks.push({i,score});
  }
  peaks.sort((a,b)=>b.score-a.score);
  // Prefer a strong event in the middle 20–85% of the track, avoiding first/last 10%.
  const candidates=peaks.filter(p=>{const t=(p.i*hop+frame/2)/sr; const r=t/T; return r>=0.10&&r<=0.90});
  const top=candidates.slice(0,Math.min(25,candidates.length));
  // Cluster nearby peaks, then choose the strongest cluster.
  const clusters=[]; const gap=Math.max(3,Math.round(8/(hop/sr)));
  for(const p of top.sort((a,b)=>a.i-b.i)){let c=clusters[clusters.length-1]; if(!c||p.i-c[c.length-1].i>gap) clusters.push([p]); else c.push(p)}
  clusters.sort((a,b)=>Math.max(...b.map(x=>x.score))-Math.max(...a.map(x=>x.score)));
  const best=(clusters[0]||candidates.slice(0,1))[0];
  const t=best?(best.i*hop+frame/2)/sr:gold; const ratio=t/T; const D=Math.abs(ratio-PHI); const delta=Math.abs(t-gold); const Dpct=D*100;
  const closeness=Dpct<0.5?'очень близко к золотой точке':Dpct<2?'близко к золотой точке':Dpct<5?'умеренное отклонение':'далеко от золотой точки';
  result.innerHTML=`<div class="row"><span class="label">Файл</span><span class="value">${esc(file.name)}</span></div><div class="row"><span class="label">Общая длительность T</span><span class="value">${fmtTime(T)} (${fmtNum(T,3)} с)</span></div><div class="row"><span class="label">Золотая точка 0,618T</span><span class="value">${fmtTime(gold)} (${fmtNum(gold,3)} с)</span></div><div class="row"><span class="label">Обнаруженное событие t</span><span class="value">${fmtTime(t)} (${fmtNum(t,3)} с)</span></div><div class="formula">D = |t/T − 0,618| = |${fmtNum(ratio,6)} − 0,618| = <b>${fmtNum(D,6)}</b></div><div class="row"><span class="label">Отклонение</span><span class="value">${fmtNum(Dpct,3)} п.п.</span></div><div class="row"><span class="label">Разница во времени</span><span class="value">${fmtNum(delta,3)} с</span></div><p><b>Вывод:</b> обнаруженное значимое акустическое событие находится ${closeness}.</p><p class="note">Метод автоматически ищет выраженный акустический пик/структурное событие по энергии и локальному изменению сигнала. Это не доказывает намеренное использование золотого сечения композитором.</p>`;
  result.style.display='block'; status.textContent='Готово.'; await ctx.close();
 }catch(e){status.innerHTML='<span class="error">Не удалось декодировать файл. Попробуйте MP3 или WAV.</span>'; console.error(e)} finally{btn.disabled=false}
}
btn.onclick=analyze;
</script>
</body></html>
